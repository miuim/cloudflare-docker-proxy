name = "cloudflare-docker-proxy"
compatibility_date = "2023-12-01"

[dev]
ip = "0.0.0.0"
port = 8787
local_protocol = "http"

[env.vars]
CUSTOM_DOMAIN = "miu.im"

[env.dev.vars]
MODE = "debug"
TARGET_UPSTREAM = "https://registry-1.docker.io"
CUSTOM_DOMAIN = "miu.im"

[env.production]
name = "cloudflare-docker-proxy"
routes = [
  { pattern = "docker.miu.im", custom_domain = true },
  { pattern = "quay.miu.im", custom_domain = true },
  { pattern = "gcr.miu.im", custom_domain = true },
  { pattern = "k8s-gcr.miu.im", custom_domain = true },
  { pattern = "k8s.miu.im", custom_domain = true },
  { pattern = "ghcr.miu.im", custom_domain = true },
  { pattern = "cloudsmith.miu.im", custom_domain = true },
  { pattern = "ecr.miu.im", custom_domain = true },
]

[env.production.vars]
MODE = "production"
TARGET_UPSTREAM = ""
CUSTOM_DOMAIN = "miu.im"

[env.staging]
name = "cloudflare-docker-proxy-staging"
routes = [
  { pattern = "docker-staging.miu.im", custom_domain = true },
]

[env.staging.vars]
MODE = "staging"
TARGET_UPSTREAM = ""
CUSTOM_DOMAIN = "miu.im"
